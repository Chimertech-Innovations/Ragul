services:
  # FastAPI Backend Service
  - type: web
    name: ragul-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: LLM_PROVIDER
        value: jarvislabs
      - key: LLM_API_BASE
        value: https://models.jarvislabs.net/v1
      - key: LLM_MODEL_NAME
        value: glm-5.3-flash
      - key: WHISPER_MODEL_SIZE
        value: tiny
      - key: WHISPER_DEVICE
        value: cpu
      - key: WHISPER_COMPUTE_TYPE
        value: int8
      - key: DISABLE_RERANKER
        value: "true"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: TTS_ENGINE
        value: gtts
      - key: JARVISLABS_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: TARGET_FARM_ID
        sync: false

  # Frontend Vite React Static Site
  - type: web
    name: ragul-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
